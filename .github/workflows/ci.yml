name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Core tests
        run: dotnet test dotnet/SlidingBlock.Core.Tests -- RunConfiguration.TreatNoTestsAsError=true
        