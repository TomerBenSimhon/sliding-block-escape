name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Core tests
        run: dotnet test dotnet/SlidingBlock.Core.Tests -- RunConfiguration.TreatNoTestsAsError=true

  unity:
    name: Unity tests
    needs: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Check Unity secrets
        run: |
          missing=0
          test -n "$UNITY_LICENSE" || { echo "::error::UNITY_LICENSE is not set"; missing=1; }
          test -n "$UNITY_EMAIL" || { echo "::error::UNITY_EMAIL is not set"; missing=1; }
          test -n "$UNITY_PASSWORD" || { echo "::error::UNITY_PASSWORD is not set"; missing=1; }
          exit $missing

      - name: Check out the code (with LFS)
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Run Unity Edit Mode tests
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: editmode
          checkName: Unity test results
